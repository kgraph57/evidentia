<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .bar { fill: #161b22; }
      .txt { fill: #c9d1d9; }
      .dim { fill: #8b949e; }
      .prompt { fill: #7ee787; }
      .cmd { fill: #c9d1d9; }
      .ok { fill: #3fb950; }
      .hal { fill: #f85149; }
      .mis { fill: #d29922; }
      .head { fill: #e6edf3; font-weight: 700; }
      .pill { fill: #1f6feb; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="820" height="360" rx="10"/>
  <rect class="bar" x="0" y="0" width="820" height="34" rx="10"/>
  <rect class="bar" x="0" y="20" width="820" height="14"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="17" r="6" fill="#27c93f"/>
  <text class="dim" x="410" y="22" text-anchor="middle">evidentia — citation audit</text>

  <text x="20" y="66"><tspan class="prompt">$</tspan> <tspan class="cmd">npx evidentia check ai-generated-answer.md</tspan></text>

  <text class="head" x="20" y="100">Evidentia: 4 citations — 1 verified, 1 mismatch, 2 hallucinated</text>
  <text x="20" y="122"><tspan class="dim">           </tspan><tspan class="hal" font-weight="700">75.0% fabrication rate</tspan></text>

  <text x="20" y="158"><tspan class="ok">  [OK ]</tspan> <tspan class="txt">doi:10.1136/bmj.i6583</tspan></text>
  <text class="dim" x="84" y="176">Paper exists and the cited metadata matches the registry record.</text>

  <text x="20" y="208"><tspan class="hal">  [HAL]</tspan> <tspan class="txt">doi:10.1056/nejmoa2105512</tspan></text>
  <text class="dim" x="84" y="226">DOI does not resolve in CrossRef or OpenAlex — no matching paper found.</text>

  <text x="20" y="258"><tspan class="hal">  [HAL]</tspan> <tspan class="txt">pmid:18768876</tspan></text>
  <text class="dim" x="84" y="276">Resolves to a different paper than the one cited (misattribution).</text>

  <text x="20" y="308"><tspan class="mis">  [MIS]</tspan> <tspan class="txt">doi:10.1002/14651858.cd012734</tspan></text>
  <text class="dim" x="84" y="326">Paper exists, but the cited metadata disagrees with the record (year).</text>

  <rect class="pill" x="600" y="92" width="200" height="26" rx="13" opacity="0.15"/>
  <text x="700" y="110" text-anchor="middle" fill="#79c0ff" font-size="12">CrossRef · PubMed · OpenAlex</text>
</svg>
