<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="470" viewBox="0 0 1060 470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
  <defs>
    <style>
      .bg   { fill: #0d1117; }
      .box  { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
      .txt  { fill: #e6edf3; font-weight: 700; }
      .dim  { fill: #8b949e; }
      .wire { stroke: #8b949e; stroke-width: 2; fill: none; }
      .ok   { fill: #3fb950; }
      .mis  { fill: #d29922; }
      .hal  { fill: #f85149; }
      .rev  { fill: #79c0ff; }
    </style>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="4.5" orient="auto">
      <path d="M0,1 L7,4.5 L0,8 Z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1060" height="470" rx="12"/>
  <text class="dim" x="28" y="34" font-size="13">How a citation flows through Evidentia</text>

  <!-- pipeline -->
  <rect class="box" x="28"  y="202" width="148" height="68" rx="9"/>
  <text class="txt" x="102" y="232" text-anchor="middle">article.md</text>
  <text class="dim" x="102" y="252" text-anchor="middle" font-size="12">file · URL · stdin</text>

  <line class="wire" x1="176" y1="236" x2="212" y2="236" marker-end="url(#arr)"/>

  <rect class="box" x="214" y="202" width="206" height="68" rx="9"/>
  <text class="txt" x="317" y="232" text-anchor="middle">extract identifiers</text>
  <text class="dim" x="317" y="252" text-anchor="middle" font-size="12">DOI · PMID · arXiv · NCT · ISBN</text>

  <line class="wire" x1="420" y1="236" x2="456" y2="236" marker-end="url(#arr)"/>

  <rect class="box" x="458" y="202" width="180" height="68" rx="9"/>
  <text class="txt" x="548" y="232" text-anchor="middle">resolve</text>
  <text class="dim" x="548" y="252" text-anchor="middle" font-size="12">against registries</text>

  <!-- registries caption (bottom-left, clear of wires) -->
  <text class="dim" x="28" y="338" font-size="12">registries:  CrossRef · PubMed · OpenAlex · arXiv · ClinicalTrials.gov</text>

  <!-- fan to 4 tiers -->
  <path class="wire" d="M638,236 C684,236 684,60  720,60"  marker-end="url(#arr)"/>
  <path class="wire" d="M638,236 C684,236 684,162 720,162" marker-end="url(#arr)"/>
  <path class="wire" d="M638,236 C684,236 684,310 720,310" marker-end="url(#arr)"/>
  <path class="wire" d="M638,236 C684,236 684,412 720,412" marker-end="url(#arr)"/>

  <!-- Verified -->
  <rect x="720" y="26"  width="320" height="68" rx="9" fill="#3fb950" opacity="0.12"/>
  <rect x="720" y="26"  width="5"   height="68" rx="2" class="ok"/>
  <text class="ok"  x="740" y="56"  font-weight="700">[OK ] Verified</text>
  <text class="dim" x="740" y="78"  font-size="12">exists &amp; metadata match</text>

  <!-- Mismatch -->
  <rect x="720" y="128" width="320" height="68" rx="9" fill="#d29922" opacity="0.12"/>
  <rect x="720" y="128" width="5"   height="68" rx="2" class="mis"/>
  <text class="mis" x="740" y="158" font-weight="700">[MIS] Bibliographic mismatch</text>
  <text class="dim" x="740" y="180" font-size="12">real paper, wrong DOI or year</text>

  <!-- Hallucination -->
  <rect x="720" y="276" width="320" height="68" rx="9" fill="#f85149" opacity="0.12"/>
  <rect x="720" y="276" width="5"   height="68" rx="2" class="hal"/>
  <text class="hal" x="740" y="306" font-weight="700">[HAL] Hallucination</text>
  <text class="dim" x="740" y="328" font-size="12">resolves to nothing / a different paper</text>

  <!-- Review -->
  <rect x="720" y="378" width="320" height="68" rx="9" fill="#79c0ff" opacity="0.12"/>
  <rect x="720" y="378" width="5"   height="68" rx="2" class="rev"/>
  <text class="rev" x="740" y="408" font-weight="700">[REV] Content review</text>
  <text class="dim" x="740" y="430" font-size="12">real — context needs a human / LLM</text>

  <!-- footer note -->
  <text class="dim" x="28" y="452" font-size="12">engine — deterministic, no API key, no LLM   ·   skill — adds a 15-criteria A–F appraisal on top</text>
</svg>
